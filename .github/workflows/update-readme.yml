name: Update README Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Update recent activity
        run: |
          python3 <<'PY'
          import subprocess
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text()

          start_marker = "<!-- ACTIVITY-START -->"
          end_marker = "<!-- ACTIVITY-END -->"

          if content.count(start_marker) != 1 or content.count(end_marker) != 1:
              raise SystemExit("README must contain exactly one pair of activity markers.")

          start = content.index(start_marker)
          end = content.index(end_marker)

          if start >= end:
              raise SystemExit("README activity markers are in the wrong order.")

            result = subprocess.run(
              [
                  "git", "log",
                  "--pretty=format:%h%x09%s",
                  "--all"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          commits = []

          for line in result.stdout.splitlines():
              sha, message = line.split("\t", 1)

              if "chore: update README activity" in message:
                  continue

              commits.append(f"- {sha} - {message}")

              if len(commits) == 5:
                  break

          activity = "\n".join(commits)

          new_section = (
              f"{start_marker}\n\n"
              "### Latest Commits\n\n"
              f"{activity}\n\n"
              f"{end_marker}"
          )

          after = end + len(end_marker)
          updated = content[:start] + new_section + content[after:]

          if updated == content:
              print("README activity is already up to date.")
          else:
              readme.write_text(updated)
              print("README activity updated.")
          PY
          
      - name: Commit README if changed
        run: |
          if git diff --quiet README.md; then
            echo "README is already up to date. No commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "DTA-27 chore: update README activity"
          git push
