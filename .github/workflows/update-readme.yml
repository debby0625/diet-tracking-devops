name: Update README Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Update recent activity
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text()

          start_marker = "<!-- ACTIVITY-START -->"
          end_marker = "<!-- ACTIVITY-END -->"

          if start_marker not in content or end_marker not in content:
              raise SystemExit("README activity markers are missing.")

          result = subprocess.run(
            [
                "git", "log",
                "--pretty=format:- %h - %s",
                "--grep=chore: update README activity",
                "--invert-grep",
                "-5"
            ],
            capture_output=True,
            text=True,
            check=True
          )

          activity = result.stdout.strip()

          new_section = (
            f"{start_marker}\n\n"
            "### Latest Commits\n\n"
            f"{activity}\n\n"
            f"{end_marker}"
          )
          before = content.index(start_marker)
          after = content.index(end_marker) + len(end_marker)

          updated = content[:before] + new_section + content[after:]

          readme.write_text(updated)
          PY

      - name: Commit README if changed
        run: |
          if git diff --quiet README.md; then
            echo "README is already up to date. No commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "DTA-27 chore: update README activity"
          git push
